name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Node 22.18+ runs the TypeScript lint parser directly via native
# type-stripping — no build step, no npm install, no node_modules.
# See plugins/spades/scripts/lint/README.md § Dependencies.
env:
  NODE_VERSION: "22"

jobs:
  skill-frontmatter:
    name: skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: ./plugins/spades/scripts/lint/lint-skill-frontmatter.sh

  agents:
    name: agent frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: ./plugins/spades/scripts/lint/lint-agents.sh

  examples:
    name: examples schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: ./plugins/spades/scripts/lint/lint-examples.sh

  learnings:
    name: learnings schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: ./plugins/spades/scripts/lint/lint-learnings.sh

  local-frontmatter:
    name: local-mode artefact schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: ./plugins/spades/scripts/lint/lint-local-frontmatter.sh
